%YAML 1.2
---
launch:
  - include:
      file: '$(find-pkg-share variobot_navigation)/launch/slam_toolbox_launch.py'

  - node_container:
      pkg: 'rclcpp_components'
      exec: 'component_container_isolated'
      name: 'nav2_container'
      namespace: ''
      output: 'screen'
      composable_node:
        - pkg: 'nav2_behaviors'
          plugin: 'behavior_server::BehaviorServer'
          name: 'behavior_server'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'
          remap:
            - from: '/cmd_vel'
              to: '/cmd_vel_nav'

        - pkg: 'nav2_bt_navigator'
          plugin: 'nav2_bt_navigator::BtNavigator'
          name: 'bt_navigator'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'

        - pkg: 'nav2_collision_monitor'
          plugin: 'nav2_collision_monitor::CollisionMonitor'
          name: 'collision_monitor'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'

        - pkg: 'nav2_controller'
          plugin: 'nav2_controller::ControllerServer'
          name: 'controller_server'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'
          remap:
            - from: '/cmd_vel'
              to: '/cmd_vel_nav'

        - pkg: 'nav2_planner'
          plugin: 'nav2_planner::PlannerServer'
          name: 'planner_server'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'

        - pkg: 'nav2_smoother'
          plugin: 'nav2_smoother::SmootherServer'
          name: 'smoother_server'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'

        - pkg: 'nav2_velocity_smoother'
          plugin: 'nav2_velocity_smoother::VelocitySmoother'
          name: 'velocity_smoother'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'
          remap:
            - from: '/cmd_vel'
              to: '/cmd_vel_nav'

        - pkg: 'nav2_waypoint_follower'
          plugin: 'nav2_waypoint_follower::WaypointFollower'
          name: 'waypoint_follower'
          param:
            - from: '$(find-pkg-share variobot_navigation)/config/nav2.yaml'

        - pkg: 'nav2_lifecycle_manager'
          plugin: 'nav2_lifecycle_manager::LifecycleManager'
          name: 'lifecycle_manager_navigation'
          param:
            - name: 'autostart'
              type: 'bool'
              value: true
            - name: 'node_names'
              type: 'list_of_str'
              value:
                [
                  'controller_server',
                  'smoother_server',
                  'planner_server',
                  'behavior_server',
                  'velocity_smoother',
                  'collision_monitor',
                  'bt_navigator',
                  'waypoint_follower'
                ]

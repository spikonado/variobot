behavior_server:
  ros__parameters:
    local_costmap_topic: 'local_costmap/costmap_raw'
    global_costmap_topic: 'global_costmap/costmap_raw'
    local_footprint_topic: 'local_costmap/published_footprint'
    global_footprint_topic: 'global_costmap/published_footprint'
    cycle_frequency: 10.0
    transform_tolerance: 0.1
    global_frame: 'map'
    local_frame: 'odom'
    robot_base_frame: 'base_link'
    introspection_mode: 'disabled'
    behavior_plugins:
      - 'spin'
      - 'backup'
      - 'drive_on_heading'
      - 'assisted_teleop'
      - 'wait'
    allow_parameter_qos_overrides: true
    simulate_ahead_time: 1.5
    bond_heartbeat_period: 0.1
    projection_time: 1.0
    simulation_time_step: 0.1
    enable_stamped_cmd_vel: true
    cmd_vel_teleop: '/cmd_vel'
    min_rotational_vel: 0.2
    max_rotational_vel: 2.5
    rotational_acc_lim: 2.0
    spin:
      plugin: 'nav2_behaviors::Spin'
    backup:
      plugin: 'nav2_behaviors::BackUp'
      minimum_speed: 0.05
      deceleration_limit: -1.5
      acceleration_limit: 1.5
    drive_on_heading:
      plugin: 'nav2_behaviors::DriveOnHeading'
      minimum_speed: 0.05
      deceleration_limit: -1.5
      acceleration_limit: 1.5
    wait:
      plugin: 'nav2_behaviors::Wait'
    assisted_teleop:
      plugin: 'nav2_behaviors::AssistedTeleop'

bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    introspection_mode: 'disabled'
    transform_tolerance: 0.1
    global_frame: 'map'
    robot_base_frame: 'base_link'
    odom_topic: '/odom'
    bond_heartbeat_period: 0.1
    allow_parameter_qos_overrides: true
    error_code_name_prefixes:
      - 'assisted_teleop'
      - 'backup'
      - 'compute_path'
      - 'drive_on_heading'
      - 'follow_path'
      - 'nav_thru_poses'
      - 'nav_to_pose'
      - 'spin'
      - 'wait'
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'
    navigate_through_poses:
      plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'

collision_monitor:
  ros__parameters:
    enabled: true
    base_frame_id: 'base_link'
    odom_frame_id: 'odom'
    cmd_vel_in_topic: '/cmd_vel_smoothed'
    cmd_vel_out_topic: '/cmd_vel'
    enable_stamped_cmd_vel: true
    state_topic: 'collision_monitor_state'
    transform_tolerance: 0.1
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 2.0
    use_realtime_priority: false
    polygons: ['RobotStop', 'FootprintApproach']
    RobotStop:
      type: 'circle'
      radius: 0.14
      action_type: 'stop'
      min_points: 3
      visualize: false
      enabled: true
    FootprintApproach:
      type: 'polygon'
      action_type: 'approach'
      footprint_topic: '/local_costmap/published_footprint'
      time_before_collision: 1.0
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: ['lidar']
    lidar:
      type: 'scan'
      topic: '/scan'
      source_timeout: 0.3
      enabled: true

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    use_realtime_priority: false
    bond_heartbeat_period: 0.1
    introspection_mode: 'disabled'
    allow_parameter_qos_overrides: true
    failure_tolerance: 0.3
    publish_zero_velocity: true
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.02
    speed_limit_topic: '/speed_limit'
    odom_topic: '/odom'
    odom_duration: 0.2
    enable_stamped_cmd_vel: true
    progress_checker_plugins: ['progress_checker']
    progress_checker:
      plugin: 'nav2_controller::SimpleProgressChecker'
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    goal_checker_plugins: ['simple_goal_checker']
    simple_goal_checker:
      plugin: 'nav2_controller::SimpleGoalChecker'
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.17
      stateful: true
    controller_plugins: ['FollowPath']
    FollowPath:
      plugin: 'nav2_mppi_controller::MPPIController'
      motion_model: 'Omni'
      iteration_count: 1
      batch_size: 1000
      time_steps: 56
      model_dt: 0.05
      vx_std: 0.15
      vy_std: 0.15
      wz_std: 0.3
      vx_min: -0.35
      vx_max: 0.35
      vy_min: -0.35
      vy_max: 0.35
      wz_max: 2.5
      ax_min: -1.5
      ax_max: 1.5
      ay_min: -1.5
      ay_max: 1.5
      az_max: 2.0
      temperature: 0.3
      gamma: 0.015
      visualize: true
      retry_attempt_limit: 3
      regenerate_noises: true
      prune_distance: 1.2
      transform_tolerance: 0.1
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics:
        - 'ConstraintCritic'
        - 'CostCritic'
        - 'GoalAngleCritic'
        - 'GoalCritic'
        - 'PathAlignCritic'
        - 'PathAngleCritic'
        - 'PathFollowCritic'
        - 'PreferForwardCritic'
        - 'TwirlingCritic'
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.35
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.8
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.35
        offset_from_furthest: 20
        use_path_orientations: false
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.35
        max_angle_to_furthest: 1.0
        mode: 0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.8
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

/local_costmap/local_costmap:
  ros__parameters:
    update_frequency: 10.0
    publish_frequency: 5.0
    global_frame: 'odom'
    robot_base_frame: 'base_link'
    rolling_window: true
    width: 2.5
    height: 2.5
    resolution: 0.05
    robot_radius: 0.12
    footprint_padding: 0.01
    plugins: ['voxel_layer', 'inflation_layer']
    voxel_layer:
      plugin: 'nav2_costmap_2d::VoxelLayer'
      enabled: true
      publish_voxel_map: true
      origin_z: 0.0
      z_resolution: 0.05
      z_voxels: 16
      max_obstacle_height: 2.0
      unknown_threshold: 15
      mark_threshold: 0
      observation_sources: 'scan'
      scan:
        topic: '/scan'
        clearing: true
        marking: true
        data_type: 'LaserScan'
        raytrace_max_range: 3.0
        raytrace_min_range: 0.0
        obstacle_max_range: 2.5
        obstacle_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
    inflation_layer:
      plugin: 'nav2_costmap_2d::InflationLayer'
      cost_scaling_factor: 4.0
      inflation_radius: 0.30
    always_send_full_costmap: true

/global_costmap/global_costmap:
  ros__parameters:
    update_frequency: 1.0
    publish_frequency: 1.0
    global_frame: 'map'
    robot_base_frame: 'base_link'
    robot_radius: 0.12
    footprint_padding: 0.01
    resolution: 0.05
    track_unknown_space: true
    plugins: ['static_layer', 'obstacle_layer', 'inflation_layer']
    obstacle_layer:
      plugin: 'nav2_costmap_2d::ObstacleLayer'
      enabled: true
      observation_sources: 'scan'
      footprint_clearing_enabled: true
      scan:
        topic: '/scan'
        clearing: true
        marking: true
        data_type: 'LaserScan'
        raytrace_max_range: 3.5
        raytrace_min_range: 0.0
        obstacle_max_range: 3.0
        obstacle_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        inf_is_valid: false
    static_layer:
      plugin: 'nav2_costmap_2d::StaticLayer'
      map_subscribe_transient_local: true
      subscribe_to_updates: true
    inflation_layer:
      plugin: 'nav2_costmap_2d::InflationLayer'
      cost_scaling_factor: 4.0
      inflation_radius: 0.35
    always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    planner_plugins: ['GridBased']
    costmap_update_timeout: 1.0
    allow_parameter_qos_overrides: true
    GridBased:
      plugin: 'nav2_navfn_planner::NavfnPlanner'
      tolerance: 0.15
      use_astar: false
      allow_unknown: true
      use_final_approach_orientation: false

smoother_server:
  ros__parameters:
    costmap_topic: '/global_costmap/costmap_raw'
    footprint_topic: 'global_costmap/published_footprint'
    transform_tolerance: 0.1
    robot_base_frame: 'base_link'
    introspection_mode: 'disabled'
    bond_heartbeat_period: 0.1
    allow_parameter_qos_overrides: true
    smoother_plugins: ['simple_smoother']
    simple_smoother:
      plugin: 'nav2_smoother::SimpleSmoother'
      tolerance: 1.0e-10
      do_refinement: true
      refinement_num: 3
      max_its: 1000
      w_data: 0.2
      w_smooth: 0.3
      enforce_path_inversion: false

waypoint_follower:
  ros__parameters:
    stop_on_failure: false
    loop_rate: 20
    global_frame_id: 'map'
    introspection_mode: 'disabled'
    bond_heartbeat_period: 0.1
    allow_parameter_qos_overrides: true

velocity_smoother:
  ros__parameters:
    use_realtime_priority: false
    enable_stamped_cmd_vel: true
    bond_heartbeat_period: 0.1
    max_velocity: [0.35, 0.35, 2.5]
    min_velocity: [-0.35, -0.35, -2.5]
    deadband_velocity: [0.0, 0.0, 0.0]
    max_accel: [1.5, 1.5, 2.0]
    max_decel: [-1.5, -1.5, -2.0]
    velocity_timeout: 0.5
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: 'CLOSED_LOOP'
    odom_topic: '/odom'
    odom_duration: 0.1

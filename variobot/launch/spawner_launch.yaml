%YAML 1.2
---
launch:
  - arg:
      name: 'description_file'
      default: '$(find-pkg-share variobot_description)/description/sdf/model.sdf.xacro'
  - arg:
      name: 'rviz_config_file'
      default: '$(find-pkg-share variobot)/config/rviz_config.rviz'

  - include:
      file: '$(find-pkg-share variobot_description)/launch/display_launch.yaml'
      let:
        - name: 'description_file'
          value: '$(var description_file)'
        - name: 'hardware_type'
          value: 'real'
        - name: 'rviz_config_file'
          value: '$(var rviz_config_file)'

  - include:
      file: '$(find-pkg-share variobot_control)/launch/controllers_launch.yaml'

  - include:
      file: '$(find-pkg-share variobot_control)/launch/controller_manager_launch.yaml'

  - node:
      pkg: 'micro_ros_agent'
      exec: 'micro_ros_agent'
      name: 'micro_ros_agent'
      args: 'udp4 --port 8888'

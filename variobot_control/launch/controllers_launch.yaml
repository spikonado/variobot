%YAML 1.2
---
launch:
  - node:
      pkg: 'controller_manager'
      exec: 'spawner'
      name: 'controllers_spawner'
      args: >
        joint_state_broadcaster
        front_left_coupling_joint_pid_controller
        front_right_coupling_joint_pid_controller
        rear_left_coupling_joint_pid_controller
        rear_right_coupling_joint_pid_controller
        mobility_system_controller
        --controller-ros-args '-r /mobility_system_controller/odometry:=/odom'
        --controller-ros-args '-r /mobility_system_controller/reference:=/cmd_vel'
        --controller-ros-args '-r /mobility_system_controller/tf_odometry:=/tf'
